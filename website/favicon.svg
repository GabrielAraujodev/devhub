<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <!-- Background Squircle with subtle border for dark/light browser tabs -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#2b2b2b" stroke-width="1.5"/>
  
  <!-- Terminal Prompt Chevron (Bold, High Legibility at 16px) -->
  <path d="M19 20 L31 32 L19 44" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Terminal Underscore / Baseline -->
  <line x1="36" y1="44" x2="48" y2="44" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round"/>
  
  <!-- Hub Connection Node (DevHub Core) -->
  <circle cx="42" cy="22" r="4.5" fill="#FFFFFF"/>
</svg>
